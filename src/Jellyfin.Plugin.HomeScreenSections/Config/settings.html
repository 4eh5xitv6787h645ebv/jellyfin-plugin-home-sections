<form id="config-page" class="configForm" style="margin: 0 auto;">
    <div class="verticalSection verticalSection-extrabottompadding">
        <h2 class="sectionTitle" data-i18n="AdminModularHomeSettings">Modular Home  - Settings:</h2>

        <div class="verticalSection verticalSection-extrabottompadding">
            <label class="checkboxContainer">
                <input is="emby-checkbox" type="checkbox" id="modularHomeEnabled" />
                <span data-i18n="AdminEnableModularHome">Enable "Modular Home". This will change your home screen into a more dynamic screen with options from other plugins to be able to contribute into what you see and are recommended.</span>
            </label>
        </div>

        <div class="verticalSection verticalSection-extrabottompadding">
            <h3 data-i18n="AdminEnabledSections">Enabled Sections</h3>
            <div id="enabledSections">
            </div>
        </div>

    </div>
    <button is="emby-button" type="submit" class="raised button-submit block btnSave" disabled>
        <span data-i18n="AdminSave">Save</span>
    </button>
</form>
<script defer>

    if (window.HomeScreenSectionsUserSettings === undefined) {

        window.HomeScreenSectionsUserSettings = {
            setup: function () {
                var uiLanguage = document.documentElement.lang || navigator.language || 'en';
                var pageTranslations = {};
                let saveButton = document.querySelector('.btnSave');

                // Translate static page elements
                ApiClient.fetch({
                    url: ApiClient.getUrl('ModularHomeViews/Translations') + '?language=' + encodeURIComponent(uiLanguage),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (translations) {
                    pageTranslations = translations;
                    document.querySelectorAll('[data-i18n]').forEach(function (el) {
                        var key = el.getAttribute('data-i18n');
                        if (translations[key]) {
                            el.textContent = translations[key];
                        }
                    });
                }).catch(function (error) {
                    console.warn('Failed to load translations:', error);
                });

                ApiClient.fetch({
                    url: ApiClient.getUrl('HomeScreen/Meta'),
                    type: 'GET',
                    dataType: 'json',
                    headers: {
                        accept: 'application/json'
                    }
                }).then(function (hssMeta) {
                    let displayPreferences = ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                        let preference = userSettings.CustomPrefs ? userSettings.CustomPrefs['useModularHome'] : undefined;
                        let enabled = hssMeta.Enabled;
                        if (hssMeta.AllowUserOverride === true && preference !== undefined) {
                            enabled = preference === 'true';
                        }
                        document.querySelector('#modularHomeEnabled').checked = enabled;
                    });

                    if (hssMeta.AllowUserOverride !== true) {
                        document.querySelector('#modularHomeEnabled').disabled = true;
                        document.querySelector('#modularHomeEnabled').parentElement.style.opacity = "0.5";
                    }

                    let sectionsSettings = ApiClient.fetch({
                        url: ApiClient.getUrl('ModularHomeViews/UserSettings?userId=' + ApiClient.getCurrentUserId()),
                        type: 'GET',
                        dataType: 'json',
                        headers: {
                            accept: 'application/json'
                        }
                    }).then(function (settings) {
                        return ApiClient.fetch({
                            url: ApiClient.getUrl('ModularHomeViews/Sections') + '?language=' + encodeURIComponent(uiLanguage),
                            type: 'GET',
                            dataType: 'json',
                            headers: {
                                accept: 'application/json'
                            }
                        }).then(function (response) {
                            if (response.TotalRecordCount > 0) {

                                let html = '';
                                for (let i = 0; i < response.TotalRecordCount; ++i) {
                                    let section = response.Items[i];

                                    let disabled = !hssMeta.AllowUserOverride;
                                    let checked = false;
                                    if (settings.EnabledSections.includes(section.Section)) {
                                        checked = true;
                                    }

                                    if (!disabled) {
                                        if (settings.LockedSections.includes(section.Section)) {
                                            disabled = true;
                                        }
                                    }

                                    if (disabled) {
                                        checked = settings.DefaultEnabledSections.includes(section.Section);
                                    }

                                    html += '<label class="checkboxContainer" style="' + (disabled ? 'opacity: 0.5;' : '') + '">';
                                    html += '<input ' + (disabled ? 'disabled="true"' : '') + ' is="emby-checkbox" type="checkbox" class="sectionEnabledCheckbox" data-section="' + section.Section + '" ' + (checked ? 'checked' : '') + ' />';
                                    html += '<span>' + section.DisplayText + '</span>';
                                    html += '</label>';
                                }

                                let elem = document.querySelector('#enabledSections');
                                elem.innerHTML = html;
                            }
                        });
                    });
                    return Promise.all([displayPreferences, sectionsSettings]);
                }).then(function () {
                    saveButton.disabled = false;
                }).catch(function (error) {
                    console.error('Failed to load user settings:', error);
                });

                document.querySelector('.configForm')
                    .addEventListener('submit', function (e) {
                        e.preventDefault();
                        if (saveButton.disabled) {
                            return false;
                        }
                        saveButton.disabled = true;

                        let displayPreferencesUpdate = ApiClient.getDisplayPreferences('usersettings', ApiClient.getCurrentUserId(), 'emby').then(function (userSettings) {
                            userSettings.CustomPrefs['useModularHome'] = document.querySelector('#modularHomeEnabled').checked ? 'true' : 'false';

                            return ApiClient.updateDisplayPreferences('usersettings', userSettings, ApiClient.getCurrentUserId(), 'emby');
                        });

                        let data = {
                            UserId: ApiClient.getCurrentUserId(),
                            EnabledSections: []
                        };

                        let checkboxes = document.querySelectorAll('.sectionEnabledCheckbox');

                        checkboxes.forEach(function (checkbox) {
                            let sectionId = checkbox.getAttribute('data-section');

                            if (checkbox.checked) {
                                data.EnabledSections.push(sectionId);
                            }
                        });

                        let sectionsUpdate = ApiClient.ajax({
                            url: ApiClient.getUrl('ModularHomeViews/UserSettings'),
                            type: 'POST',
                            data: JSON.stringify(data),
                            contentType: 'application/json'
                        });

                        Promise.all([displayPreferencesUpdate, sectionsUpdate]).then(function () {
                            Dashboard.alert(pageTranslations['AdminSettingsUpdated'] || 'Settings have been updated, reloading page in 2 seconds.');

                            setTimeout(function () {
                                location.reload(true);
                            }, 2000);
                        }).catch(function (error) {
                            saveButton.disabled = false;
                            Dashboard.alert(pageTranslations['AdminSettingsUpdateFailed'] || 'Unable to save settings. Please try again.');
                        });

                        return false;
                    });
            }
        }
    }

    window.HomeScreenSectionsUserSettings.setup();
</script>
